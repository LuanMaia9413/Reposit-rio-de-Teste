name: Meu primeiro pipeline

on: [push]

jobs:
  meu-primeiro-job:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar sistema operacional
        run: uname -a
        
      - name: Verificar java
        run: java -version
        
      - name: Verificar Maven
        run: mvn -version
        
      - name: Mensagem
        run: echo "Meu primeiro pipeline está funcionando"
